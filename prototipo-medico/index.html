<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="description" content="Plataforma de análisis clínico asistido por inteligencia artificial.">
    <title>Smart-Medical IA - Plataforma de Análisis Clínico</title>

    <!-- Tema resuelto antes del primer paint: evita el flash blanco al recargar en oscuro -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('sm-theme') || 'system'
          var dark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b1220' : '#f1f5f9')
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light')
        }
      })()
    </script>

    <!-- Inter para UI y tablas, Poppins para títulos y marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    >
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
