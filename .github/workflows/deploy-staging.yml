name: Deploy Frontend Staging

on:
  push:
    branches:
      - feature/frontend-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/feature/frontend-staging"}' \
            "${{ secrets.DOKPLOY_FRONTEND_STAGING_WEBHOOK }}")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.txt)"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: webhook returned $HTTP_STATUS"
            exit 1
          fi

